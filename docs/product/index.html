<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>native web dev</title>

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  
  <link rel="stylesheet" href="/__src/css/reset.css">
  <link rel="stylesheet" href="/__src/css/fonts.css">
  <link rel="stylesheet" href="/__src/css/global-styles.css">
  
  <script type="module">
    import {router} from "/__src/js/router.js";
    router.start();
  </script>

  <script type="module">
    import loaderElement from "/__src/components/loader-element/index.js"
    customElements.define('loader-element', loaderElement)
  </script>

  <script type="module">
    import docQuick from "/__src/components/doc-quick.js"
    customElements.define('doc-quick', docQuick)
  </script>
</head>


<loader-element app="body" path="/__src/components/" brand="nativelayer.dev"></loader-element>
<body>
  <top-bar></top-bar>
  <doc-quick
    chapter-mode
    theme-css="/__src/css/code-syntax.css"
    expander-color="hsl(var(--accent-color-hsl))"
    section-numbers
  ></doc-quick>
</body>
</html>
