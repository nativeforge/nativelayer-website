<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>const s=localStorage.getItem("theme-mode"),d=window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("theme-mode",s||(d?"dark":"light"))</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nativelayer.dev - stock market</title>

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="/__src/css/reset.css" blocking="render">
  <link rel="stylesheet" href="/__src/css/fonts.css" blocking="render">
  <link rel="stylesheet" href="/__src/css/global-styles.css" blocking="render">

  <script type="module">
    import { listenForCSSVars, requestCSSVars } from '/__src/js/css-vars-sync.js';
    listenForCSSVars();
    requestAnimationFrame(() => requestCSSVars());
  </script>

  <script type="module">
    import monitorLoading from "/__src/components/monitor-loading/index.js"
    customElements.define('monitor-loading', monitorLoading)
  </script>

  <monitor-loading target="body" path="/__src/components/" brand="nativelayer.dev" show-duration="400" monitor></monitor-loading>

</head>
<body style="opacity: 0; transform: translateY(16px);">
  <re-theme target-element="nx-stock-market"></re-theme>
  <base-back-to style="position: fixed; top: calc(var(--space-unit) * 4); left: calc(var(--space-unit) * 4); z-index: 100;" reveal></base-back-to>

  <nx-stock-market reveal></nx-stock-market>

</body>
</html>
